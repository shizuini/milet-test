        desc: "你很容易被温柔而笨拙的爱打动。你未必总是强大，但你会因为某个人真实的靠近，而慢慢长出继续走下去的勇气。",

    let answers = new Array(questions.length).fill(null);
    let current = 0;

    const quizArea = document.getElementById("quizArea");
    const progressFill = document.getElementById("progressFill");
    const progressText = document.getElementById("progressText");
    const progressPercent = document.getElementById("progressPercent");

    function updateProgress() {
      const percent = Math.round(((current + 1) / questions.length) * 100);
      progressText.textContent = `第 ${Math.min(current + 1, questions.length)} / ${questions.length} 题`;
      progressPercent.textContent = `${percent}%`;
      progressFill.style.width = `${percent}%`;
    }

    function renderQuestion() {
      updateProgress();
      const selected = answers[current];

      quizArea.innerHTML = `
        <div class="question-number">Question ${current + 1}</div>
        <h2 class="question-text">${questions[current].text}</h2>

        <div class="scale-labels">
  <span>${questions[current].left}</span>
  <span>${questions[current].right}</span>
</div>

        <div class="scale">
          ${[1,2,3,4,5,6,7].map(num => `
            <button
              class="${selected === num ? 'selected' : ''}"
              onclick="selectAnswer(${num})"
            >${num}</button>
          `).join('')}
        </div>

        <div class="hint">请选择最符合你真实状态的分数</div>

        <div class="nav">
          <button
            class="btn-secondary ${current === 0 ? 'btn-disabled' : ''}"
            onclick="goPrev()"
            ${current === 0 ? 'disabled' : ''}
          >上一题</button>

          <button
            class="btn-primary ${selected === null ? 'btn-disabled' : ''}"
            onclick="goNext()"
          >${current === questions.length - 1 ? '查看结果' : '下一题'}</button>
        </div>
      `;
    }

    function selectAnswer(value) {
      answers[current] = value;
      renderQuestion();
    }

    function goPrev() {
      if (current > 0) {
        current--;
        renderQuestion();
      }
    }

    function goNext() {
      if (answers[current] === null) {
        alert("请先选择一个分数");
        return;
      }

      if (current < questions.length - 1) {
        current++;
        renderQuestion();
      } else {
        showResult();
      }
    }

    function calculateScores() {
      const scores = { rel: 0, exp: 0, emo: 0, self: 0, time: 0, vibe: 0 };

      answers.forEach((val, i) => {
        const dim = dimensionMap[i];
        scores[dim] += val;
      });

      for (const key in scores) {
        scores[key] = scores[key] / dimensionCounts[key];
      }

      return scores;
    }

    function getRankedSongs(scores) {
  return songs
    .map(song => {
      let distance =
        Math.pow(scores.rel - song.rel, 2) +
        Math.pow(scores.exp - song.exp, 2) +
        Math.pow(scores.emo - song.emo, 2) +
        Math.pow(scores.self - song.self, 2) +
        Math.pow(scores.time - song.time, 2) +
        Math.pow(scores.vibe - song.vibe, 2);

      // 航海前夜降低概率
      if (song.key === "航海前夜") {
        distance += 1.2;
      }

      return { ...song, distance };
    })
    .sort((a, b) => a.distance - b.distance);
}

    function showResult() {
      const scores = calculateScores();
      const rankedSongs = getRankedSongs(scores);

      const bestSong = rankedSongs[0];
      const similarSongs = rankedSongs.slice(1, 4);

      progressText.textContent = "测试完成";
      progressPercent.textContent = "100%";
      progressFill.style.width = "100%";

      quizArea.innerHTML = `
        <h2 class="result-title">测试结果</h2>
        <div class="result-song">你最像《${bestSong.key}》</div>

        <div class="result-image-wrap">
          <img src="${bestSong.image}" alt="${bestSong.key}" class="result-image">
        </div>

        <div class="result-lyric">“${bestSong.lyric}”</div>

        <div class="result-desc">${bestSong.desc}</div>

        <div class="similar-box">
          <div class="similar-title">另外 3 首和你也很接近</div>
          <div class="similar-list">
            ${similarSongs.map(song => `
              <div class="similar-item">《${song.key}》</div>
            `).join('')}
          </div>
        </div>

        <div class="scores-box">
          <div class="score-item">
            <div class="label">关系重心</div>
            <div class="value">${scores.rel.toFixed(2)}</div>
          </div>
          <div class="score-item">
            <div class="label">表达方式</div>
            <div class="value">${scores.exp.toFixed(2)}</div>
          </div>
          <div class="score-item">
            <div class="label">情绪能量</div>
            <div class="value">${scores.emo.toFixed(2)}</div>
          </div>
          <div class="score-item">
            <div class="label">主体稳定</div>
            <div class="value">${scores.self.toFixed(2)}</div>
          </div>
          <div class="score-item">
            <div class="label">时间取向</div>
            <div class="value">${scores.time.toFixed(2)}</div>
          </div>
          <div class="score-item">
            <div class="label">氛围偏好</div>
            <div class="value">${scores.vibe.toFixed(2)}</div>
          </div>
        </div>

        <div class="result-actions">
          <button class="btn-secondary" onclick="restartTest()">重新测试</button>
          <button class="btn-primary" onclick="shareResult('${bestSong.key}')">复制结果文案</button>
        </div>
        <div class="feedback-text">
  您对这个测试有任何建议，都可以邮件联系
  <a href="mailto:imnotshizu3@gmail.com">imnotshizu3@gmail.com</a>，
  也欢迎分享测试结果，方便香蕉蕉调整参数等设计~
</div>
      `;
    }

    function restartTest() {
      answers = new Array(questions.length).fill(null);
      current = 0;
      renderQuestion();
    }

    function shareResult(songName) {
      const text = `我测出来最像 milet 的《${songName}》！你也来试试吧～`;
      navigator.clipboard.writeText(text).then(() => {
        alert("结果文案已复制");
      }).catch(() => {
        alert("复制失败，请手动复制。");
      });
    }
    
    renderQuestion();
  </script>

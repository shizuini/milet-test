      const scores = { rel: 0, exp: 0, emo: 0, self: 0, time: 0, vibe: 0 };

      answers.forEach((val, i) => {
        const dim = dimensionMap[i];
        scores[dim] += val;
      });

      for (const key in scores) {
        scores[key] = scores[key] / dimensionCounts[key];
      }

      return scores;
    }

    function getRankedSongs(scores) {
      return songs
        .map(song => {
          const distance =
            Math.pow(scores.rel - song.rel, 2) +
            Math.pow(scores.exp - song.exp, 2) +
            Math.pow(scores.emo - song.emo, 2) +
            Math.pow(scores.self - song.self, 2) +
            Math.pow(scores.time - song.time, 2) +
            Math.pow(scores.vibe - song.vibe, 2);

          return { ...song, distance };
        })
        .sort((a, b) => a.distance - b.distance);
    }

    function showResult() {
      const scores = calculateScores();
      const rankedSongs = getRankedSongs(scores);

      const bestSong = rankedSongs[0];
      const similarSongs = rankedSongs.slice(1, 4);

      progressText.textContent = "测试完成";
      progressPercent.textContent = "100%";
      progressFill.style.width = "100%";

      quizArea.innerHTML = `
        <h2 class="result-title">测试结果</h2>
        <div class="result-song">你最像《${bestSong.key}》</div>

        <div class="result-image-wrap">
          <img src="${bestSong.image}" alt="${bestSong.key}" class="result-image">
        </div>

        <div class="result-lyric">“${bestSong.lyric}”</div>

        <div class="result-desc">${bestSong.desc}</div>

        <div class="similar-box">
          <div class="similar-title">另外 3 首和你也很接近</div>
          <div class="similar-list">
            ${similarSongs.map(song => `
              <div class="similar-item">《${song.key}》</div>
            `).join('')}
          </div>
        </div>

        <div class="scores-box">
          <div class="score-item">
            <div class="label">关系重心</div>
            <div class="value">${scores.rel.toFixed(2)}</div>
          </div>
          <div class="score-item">
            <div class="label">表达方式</div>
            <div class="value">${scores.exp.toFixed(2)}</div>
          </div>
          <div class="score-item">
            <div class="label">情绪能量</div>
            <div class="value">${scores.emo.toFixed(2)}</div>
          </div>
          <div class="score-item">
            <div class="label">主体稳定</div>
            <div class="value">${scores.self.toFixed(2)}</div>
          </div>
          <div class="score-item">
            <div class="label">时间取向</div>
            <div class="value">${scores.time.toFixed(2)}</div>
          </div>
          <div class="score-item">
            <div class="label">氛围偏好</div>
            <div class="value">${scores.vibe.toFixed(2)}</div>
          </div>
        </div>

        <div class="result-actions">
          <button class="btn-secondary" onclick="restartTest()">重新测试</button>
          <button class="btn-primary" onclick="shareResult('${bestSong.key}')">复制结果文案</button>
        </div>
      `;
    }

    function restartTest() {
      answers = new Array(questions.length).fill(null);
      current = 0;
      renderQuestion();
    }

    function shareResult(songName) {
      const text = `我测出来最像 milet 的《${songName}》！你也来试试吧～`;
      navigator.clipboard.writeText(text).then(() => {
        alert("结果文案已复制");
      }).catch(() => {
        alert("复制失败，请手动复制。");
      });
    }

    renderQuestion();
  </script>
</body>
</html>

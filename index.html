      .nav,

        height: 190px;

      {
        key: "seventh heaven",
        A:5.0,B:6.5,C:6.5,D:4.5,E:5.0,F:6.5,G:5.0,H:6.0,
        lyric: "Cause our heaven is here",
        desc: "你很吃氛围、节奏和当下共振。你要的不是规矩，而是一种“此刻就够了”的炽热感。",
        image: "images/10.jpg"
      },
      {
        key: "drown",
        A:5.5,B:4.0,C:5.5,D:2.5,E:2.5,F:5.0,G:5.5,H:5.5,
        lyric: "You're gonna make me drown",
        desc: "你常常处在夹缝和悬置之中，像一边下沉一边还想停留。你的情绪不是爆裂的，而是深水式的。",
        image: "images/11.jpg"
      },
      {
        key: "rewrite",
        A:5.0,B:5.0,C:5.0,D:6.5,E:6.5,F:4.0,G:5.0,H:4.5,
        lyric: "We already know we're special",
        desc: "你不太愿意接受既定剧本。就算现实不完美，你也会想和重要的人一起把它改写成新的版本。",
        image: "images/7.jpg"
      },
      {
        key: "hanataba",
        A:6.0,B:3.5,C:4.5,D:5.2,E:5.5,F:2.5,G:5.0,H:2.0,
        lyric: "あなたといるから 怖くないよ / 只要与你在一起，我便不再害怕",
        desc: "你很容易被温柔而笨拙的爱打动。你未必总是强大，但你会因为某个人真实的靠近，而慢慢长出继续走下去的勇气。",
        image: "images/5.jpg"
      }
    ];

    let answers = new Array(questions.length).fill(null);
    let current = 0;

    function updateProgress() {
      const shownIndex = current + 1;
      const percent = Math.round((shownIndex / questions.length) * 100);
      document.getElementById("progressText").textContent = `第 ${shownIndex} / ${questions.length} 题`;
      document.getElementById("progressPercent").textContent = `${percent}%`;
      document.getElementById("progressFill").style.width = `${percent}%`;
    }

    function render() {
      updateProgress();

      const q = questions[current];
      const isFirst = current === 0;
      const isLast = current === questions.length - 1;
      const hasAnswer = answers[current] !== null;

      document.getElementById("quizArea").innerHTML = `
        <div class="question-number">Question ${current + 1}</div>
        <div class="question-text">${q.text}</div>

        <div class="scale-labels">
          <span>${q.left}</span>
          <span>${q.right}</span>
        </div>

        <div class="scale">
          ${[1,2,3,4,5,6,7].map(n => `
            <button
              class="${answers[current] === n ? 'selected' : ''}"
              onclick="select(${n})"
            >${n}</button>
          `).join("")}
        </div>

        <div class="hint">可以先选择，再点下一题</div>

        <div class="nav">
          <button
            class="btn-secondary ${isFirst ? 'btn-disabled' : ''}"
            onclick="prevQuestion()"
            ${isFirst ? 'disabled' : ''}
          >
            上一题
          </button>

          <button
            class="btn-primary ${!hasAnswer ? 'btn-disabled' : ''}"
            onclick="${isLast ? 'showResult()' : 'nextQuestion()'}"
            ${!hasAnswer ? 'disabled' : ''}
          >
            ${isLast ? '查看结果' : '下一题'}
          </button>
        </div>
      `;
    }

    function select(n) {
      answers[current] = n;
      render();
    }

    function prevQuestion() {
      if (current > 0) {
        current--;
        render();
      }
    }

    function nextQuestion() {
      if (answers[current] === null) return;
      if (current < questions.length - 1) {
        current++;
        render();
      }
    }

    function getScores() {
      const scores = { A:0, B:0, C:0, D:0, E:0, F:0, G:0, H:0 };

      answers.forEach((value, index) => {
        scores[dimensionMap[index]] += value;
      });

      for (const key in scores) {
        scores[key] = +(scores[key] / dimensionCounts[key]).toFixed(1);
      }

      return scores;
    }

    function getSortedSongs(scores) {
      return songs
        .map(song => {
          const distance =
            Math.pow(scores.A - song.A, 2) +
            Math.pow(scores.B - song.B, 2) +
            Math.pow(scores.C - song.C, 2) +
            Math.pow(scores.D - song.D, 2) +
            Math.pow(scores.E - song.E, 2) +
            Math.pow(scores.F - song.F, 2) +
            Math.pow(scores.G - song.G, 2) +
            Math.pow(scores.H - song.H, 2);

          return { ...song, distance };
        })
        .sort((a, b) => a.distance - b.distance);
    }

    function renderScores(scores) {
      return `
        <div class="scores-box">
          <div class="score-item"><div class="label">A 情感指向</div><div class="value">${scores.A}</div></div>
          <div class="score-item"><div class="label">B 表达强度</div><div class="value">${scores.B}</div></div>
          <div class="score-item"><div class="label">C 情绪能量</div><div class="value">${scores.C}</div></div>
          <div class="score-item"><div class="label">D 自我稳定</div><div class="value">${scores.D}</div></div>
          <div class="score-item"><div class="label">E 时间取向</div><div class="value">${scores.E}</div></div>
          <div class="score-item"><div class="label">F 世界氛围</div><div class="value">${scores.F}</div></div>
          <div class="score-item"><div class="label">G 连接方式</div><div class="value">${scores.G}</div></div>
          <div class="score-item"><div class="label">H 现实抽离</div><div class="value">${scores.H}</div></div>
        </div>
      `;
    }

    function renderSimilarSongs(sortedSongs) {
      const similar = sortedSongs.slice(1, 4);
      return `
        <div class="similar-box">
          <div class="similar-title">你也很像这些歌</div>
          <div class="similar-list">
            ${similar.map(song => `
              <div class="similar-item">《${song.key}》</div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function showResult() {
      if (answers.includes(null)) return;

      const scores = getScores();
      const sortedSongs = getSortedSongs(scores);
      const best = sortedSongs[0];

      document.getElementById("progressText").textContent = "测试完成";
      document.getElementById("progressPercent").textContent = "100%";
      document.getElementById("progressFill").style.width = "100%";

      document.getElementById("quizArea").innerHTML = `
        <div class="result-title">你最像</div>
        <div class="result-song">《${best.key}》</div>

        <div class="result-image-wrap">
          <img class="result-image" src="${best.image}" alt="${best.key}">
        </div>

        <div class="result-lyric">${best.lyric}</div>
        <div class="result-desc">${best.desc}</div>

        ${renderSimilarSongs(sortedSongs)}
        ${renderScores(scores)}

        <div class="result-actions">
          <button class="btn-secondary" onclick="restartTest()">重新测试</button>
          <button class="btn-primary" onclick="shareResult('${best.key.replace(/'/g, "\\'")}')">复制结果文案</button>
        </div>

        <div class="feedback-text">
          您对这个测试有任何建议，都可以邮件联系
          <a href="mailto:imnotshizu3@gmail.com">imnotshizu3@gmail.com</a>，
          也欢迎分享测试结果，方便香蕉蕉调整参数等设计~
        </div>
      `;
    }

    function restartTest() {
      answers = new Array(questions.length).fill(null);
      current = 0;
      updateProgress();
      render();
    }

    function shareResult(songName) {
      const text = `我测出来最像 milet 的《${songName}》！你也来试试吧～`;
      navigator.clipboard.writeText(text)
        .then(() => alert("结果文案已复制"))
        .catch(() => alert("复制失败，请手动复制。"));
    }

    updateProgress();
    render();
  </script>
</body>
</html>
